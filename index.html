<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enterprise Management Portal V5.2</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--line:#e5e7eb;--accent:#1f6feb;--danger:#d92d20}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff}
button.secondary{background:#eef2f6;color:var(--text)}button.danger{background:var(--danger)}
.hidden{display:none!important}.app{min-height:100vh}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10}
.brand{font-weight:800}.layout{display:flex;min-height:calc(100vh - 60px)}aside{width:230px;background:#111827;color:#fff;padding:14px;flex-shrink:0}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d1d5db;margin:4px 0}.nav button:hover{background:#1f2937;color:#fff}
main{padding:18px;width:100%;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.metric{font-size:26px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.tablewrap table{border-collapse:collapse;width:100%;min-width:800px}.tablewrap th,.tablewrap td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.tablewrap th{background:#f8fafc}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 30px #00000010}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.msg{padding:10px;border-radius:10px;background:#fff4e5;margin:10px 0}.mobile-menu{display:none}
@media(max-width:800px){aside{display:none}.mobile-menu{display:block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}main{padding:12px}.top{padding:0 10px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.brand{font-size:14px}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="loginbox">
    <h2>Enterprise Management Portal</h2>
    <div class="muted">V5.2 • Secure Login</div>
    <div id="loginMsg"></div>
    <div class="field"><label>No. HP</label><input id="phone" inputmode="tel" autocomplete="username" placeholder="08xxxxxxxxxx"></div>
    <div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6 digit PIN"></div>
    <button id="loginBtn" style="width:100%">Masuk</button>
    <p class="muted">PIN tidak disimpan di browser. Verifikasi dilakukan oleh backend.</p>
  </div>
</div>

<div id="appView" class="app hidden">
<header class="top"><div><span class="brand">Enterprise Portal V5.2</span></div><div><button id="mobileBtn" class="secondary mobile-menu">Menu</button> <span id="userBadge"></span> <button id="logoutBtn" class="secondary">Keluar</button></div></header>
<div class="layout">
<aside><div class="nav" id="nav"></div></aside>
<main id="content"><h2>Dashboard</h2></main>
</div>
</div>

<script>
/* ===== DEPLOY CONFIG ===== */
const APP_CONFIG = {
  API_URL: "PASTE_APPS_SCRIPT_EXEC_URL_HERE",
  CAMERA_URL: "PASTE_GITHUB_CAMERA_URL_HERE"
};
/* =========================== */

const state={token:null,user:null,menu:[],config:{}};

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function msg(t,ok=false){$("loginMsg").innerHTML=`<div class="msg">${esc(t)}</div>`;}
function apiAvailable(){return APP_CONFIG.API_URL && !APP_CONFIG.API_URL.includes("PASTE_");}

async function api(endpoint,method="GET",payload={}){
  if(!apiAvailable()) throw new Error("API_URL belum diisi.");
  const body={...payload,endpoint,token:state.token};
  const opt={method,headers:{"Content-Type":"application/json"}};
  if(method!=="GET") opt.body=JSON.stringify(body);
  else {const q=new URLSearchParams(body); return fetch(APP_CONFIG.API_URL+"?"+q).then(r=>r.json());}
  const r=await fetch(APP_CONFIG.API_URL,opt); return r.json();
}

$("loginBtn").onclick=async()=>{
  const phone=$("phone").value.trim(),pin=$("pin").value.trim();
  if(!phone||!pin)return msg("No. HP dan PIN wajib diisi.");
  try{
    const r=await api("login","POST",{phone,pin});
    if(!r.ok) return msg(r.message||"Login gagal.");
    state.token=r.token;state.user=r.user;
    sessionStorage.setItem("V52_TOKEN",state.token);
    sessionStorage.setItem("V52_USER",JSON.stringify(state.user));
    await boot();
  }catch(e){msg(e.message||"API tidak dapat diakses.");}
};

$("logoutBtn").onclick=()=>{sessionStorage.clear();location.reload();};

async function boot(){
  $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");
  $("userBadge").textContent=(state.user?.Nama||state.user?.Name||"User")+" • "+(state.user?.Role||"");
  try{
    const r=await api("menu");
    state.menu=r.data||r.menu||[];
  }catch(e){state.menu=[];}
  renderNav(); showDashboard();
}
function renderNav(){
  $("nav").innerHTML="";
  const dash=document.createElement("button");dash.textContent="🏠 Dashboard";dash.onclick=showDashboard;$("nav").appendChild(dash);
  state.menu.forEach(m=>{
    const b=document.createElement("button");b.textContent=(m.Icon||"▣")+" "+(m.Label||m.Menu_ID||"Menu");
    b.onclick=()=>openModule(m.Module_ID);$("nav").appendChild(b);
  });
}
async function showDashboard(){
  $("content").innerHTML=`<h2>Executive Dashboard</h2><div class="muted">Dashboard dibangun dari CFG_DASHBOARD + CFG_WIDGET.</div><div id="dash" class="grid" style="margin-top:14px"><div class="card">Memuat...</div></div>`;
  try{
    const r=await api("dashboard","GET",{dashboardId:"DEFAULT"});
    renderDashboard(r.data||r.widgets||[]);
  }catch(e){$("dash").innerHTML=`<div class="card"><b>Dashboard siap.</b><br><span class="muted">${esc(e.message)}</span></div>`;}
}
function renderDashboard(items){
  if(!Array.isArray(items)||!items.length)return;
  $("dash").innerHTML=items.map(x=>`<div class="card"><div class="muted">${esc(x.title||x.Title||"Metric")}</div><div class="metric">${esc(x.value??x.Value??"-")}</div></div>`).join("");
}
async function openModule(moduleId){
  $("content").innerHTML=`<h2>${esc(moduleId)}</h2><div class="card">Memuat konfigurasi modul...</div>`;
  try{
    const r=await api("module","GET",{moduleId});
    const m=r.data||r.module||r;
    renderModule(m,moduleId);
  }catch(e){$("content").innerHTML=`<h2>${esc(moduleId)}</h2><div class="card">Modul belum dapat dimuat: ${esc(e.message)}</div>`;}
}
function renderModule(m,moduleId){
  const title=m.Module_Name||m.ModuleName||moduleId;
  $("content").innerHTML=`<h2>${esc(title)}</h2>
  <div class="toolbar"><button onclick="loadTable('${esc(m.Table_ID||m.tableId||"")}')">Tampilkan Data</button>
  <button class="secondary" onclick="showForm('${esc(m.Form_ID||m.formId||"")}')">Input Baru</button></div>
  <div id="moduleArea"></div>`;
}
async function loadTable(tableId){
  if(!tableId)return $("moduleArea").innerHTML='<div class="card">Table_ID belum dikonfigurasi.</div>';
  $("moduleArea").innerHTML='<div class="card">Memuat data...</div>';
  try{
    const r=await api("table","GET",{tableId});
    const t=r.data||r.table||r;
    const rows=await api("data","GET",{tableId});
    renderTable(t,rows.data||rows.rows||[]);
  }catch(e){$("moduleArea").innerHTML=`<div class="card">Gagal memuat: ${esc(e.message)}</div>`;}
}
function renderTable(t,rows){
  const cols=t.columns||t.Columns||Object.keys(rows[0]||{});
  if(!cols.length)return $("moduleArea").innerHTML='<div class="card">Belum ada kolom/data.</div>';
  $("moduleArea").innerHTML=`<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.Header_Label||c.Column_Source||c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c.Column_Source||c]??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
async function showForm(formId){
  if(!formId)return $("moduleArea").innerHTML='<div class="card">Form_ID belum dikonfigurasi.</div>';
  $("moduleArea").innerHTML='<div class="card">Memuat form...</div>';
  try{
    const r=await api("module","GET",{moduleId:formId});
    const f=r.form||r.data||r;
    const fields=f.fields||[];
    $("moduleArea").innerHTML=`<div class="card"><div class="formgrid">${fields.map(fieldHtml).join("")}</div><div class="toolbar"><button onclick="submitDynamicForm('${esc(formId)}')">Simpan</button></div></div>`;
  }catch(e){$("moduleArea").innerHTML=`<div class="card">Form belum tersedia: ${esc(e.message)}</div>`;}
}
function fieldHtml(f){
  const id=esc(f.Field_ID||f.fieldId),label=esc(f.Label||id),type=(f.Type||"text").toLowerCase();
  if(f.Hidden)return "";
  if(type==="select")return `<div class="field"><label>${label}</label><select id="f_${id}"><option value="">Pilih...</option></select></div>`;
  if(type==="textarea")return `<div class="field"><label>${label}</label><textarea id="f_${id}" ${f.Required?"required":""}></textarea></div>`;
  return `<div class="field"><label>${label}</label><input id="f_${id}" type="${["number","date","datetime-local"].includes(type)?type:"text"}" ${f.Readonly?"readonly":""} ${f.Required?"required":""} placeholder="${esc(f.Placeholder||"")}"></div>`;
}
async function submitDynamicForm(formId){
  const data={};document.querySelectorAll("#moduleArea [id^=f_]").forEach(el=>data[el.id.slice(2)]=el.value);
  try{const r=await api("data","POST",{formId,data});alert(r.ok?"Data berhasil disimpan.":(r.message||"Gagal menyimpan."));}
  catch(e){alert(e.message);}
}

$("mobileBtn").onclick=()=>document.querySelector("aside").style.display=document.querySelector("aside").style.display==="block"?"none":"block";

(function restore(){
  const t=sessionStorage.getItem("V52_TOKEN"),u=sessionStorage.getItem("V52_USER");
  if(t&&u){state.token=t;state.user=JSON.parse(u);boot();}
})();
</script>
</body>
</html>
